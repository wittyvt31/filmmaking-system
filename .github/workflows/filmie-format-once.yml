name: Temporary external GLB formatter
on:
  push:
    branches: [filmieTwo]
    paths: [.github/workflows/filmie-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize GLB import source and tests
        run: |
          pnpm exec prettier --write apps/web-api/src/external-library.ts apps/web-api/src/external-glb.ts tests/external-library.test.ts
          git add apps/web-api/src/external-library.ts apps/web-api/src/external-glb.ts tests/external-library.test.ts
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "style(assets): normalize external GLB importer formatting"
            git push origin HEAD:filmieTwo
          fi
