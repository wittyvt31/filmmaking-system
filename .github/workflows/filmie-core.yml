name: Filmie core integration

on:
  push:
    branches: [filmieTwo]
  pull_request:
    branches: [filmieTwo, master]

permissions:
  contents: read

concurrency:
  group: filmie-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  articulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check affected TypeScript projects
        run: pnpm exec tsc -b packages/contracts packages/assets packages/scene engines/blender apps/cli apps/web-api apps/web --pretty false
      - name: Test asset and articulation contracts
        run: pnpm exec vitest run tests/asset-descriptor.test.ts tests/asset-studio.test.ts tests/external-library.test.ts --reporter=dot
      - name: Bundle browser workspaces
        run: pnpm --filter @filmmaking/web build
      - name: Check Python asset workers compile
        run: python3 -m py_compile engines/blender/worker/procedural_asset.py engines/blender/worker/asset_preview.py engines/blender/worker/model_import.py tools/blender/filmie_bridge/__init__.py
      - name: Check formatting of asset pipeline
        run: |
          pnpm exec prettier --check packages/scene/src/articulated-kinematics.ts packages/scene/src/index.ts engines/blender/src/index.ts engines/blender/src/procedural-assets.ts apps/cli/src/index.ts tests/asset-descriptor.test.ts examples/asset-lab/crane.definition.json apps/web/src/api.ts apps/web/src/main.tsx apps/web/src/asset-studio.tsx apps/web/src/asset-viewport.tsx apps/web/src/app.css apps/web-api/src/server.ts apps/web-api/src/asset-studio.ts apps/web-api/src/types.ts tests/asset-studio.test.ts apps/web/src/library-studio.tsx apps/web-api/src/external-library.ts apps/web-api/src/external-glb.ts tests/external-library.test.ts packages/contracts/src/index.ts
