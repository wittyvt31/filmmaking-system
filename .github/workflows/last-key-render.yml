name: The Last Key cinematic render

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Render profile
        required: true
        default: preview
        type: choice
        options: [preview, final]
  push:
    branches: [filmieTwo]
    paths:
      - examples/the-last-key/**
      - .github/workflows/last-key-render.yml

permissions:
  contents: read

concurrency:
  group: last-key-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PROFILE: ${{ inputs.profile || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Blender and media tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg libegl1 libgl1-mesa-dri xvfb xauth libxi6 libxrender1
          curl -fL --retry 3 --retry-delay 2 -o /tmp/blender-5.2.3-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz
          curl -fL --retry 3 -o /tmp/blender-5.2.3.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.3.sha256
          (cd /tmp && grep 'blender-5.2.3-linux-x64.tar.xz' blender-5.2.3.sha256 | sha256sum -c -)
          tar -xJf /tmp/blender-5.2.3-linux-x64.tar.xz -C /tmp
          printf '%s\n' '#!/bin/sh' 'exec xvfb-run -a /tmp/blender-5.2.3-linux-x64/blender "$@"' > /tmp/filmie-blender
          chmod +x /tmp/filmie-blender
          /tmp/blender-5.2.3-linux-x64/blender --version | head -n 2
      - name: Build production runtime
        run: pnpm exec tsc -b --pretty false
      - name: Select render profile and validate assets
        env:
          FILMIE_BLENDER: /tmp/filmie-blender
        run: |
          set -o pipefail
          mkdir -p renders/last-key
          if [ "$PROFILE" = "preview" ]; then
            cp examples/the-last-key/preview.json examples/the-last-key/manifest.json
          fi
          node apps/cli/dist/index.js validate --project examples/the-last-key --output renders/last-key --cache .cache/last-key | tee renders/last-key/validation.log
      - name: Render seven-cut vault animation
        env:
          FILMIE_BLENDER: /tmp/filmie-blender
        run: |
          set -o pipefail
          node apps/cli/dist/index.js render --project examples/the-last-key --output renders/last-key --cache .cache/last-key --workers 1 --timeout 900000 2>&1 | tee renders/last-key/render.log
      - name: Inspect final media
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          videos = sorted(Path("renders/last-key").rglob("*.mp4"))
          assert videos, "No rendered MP4 was produced"
          for video in videos:
              if video.stat().st_size < 1024:
                  raise AssertionError(f"Empty video: {video}")
              result = subprocess.run(["ffprobe","-v","error","-select_streams","v:0","-show_entries","stream=width,height,nb_frames","-of","json",str(video)],capture_output=True,text=True,check=True)
              print(video, result.stdout)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filmie-last-key-${{ env.PROFILE }}
          path: renders/last-key/
          retention-days: 7
