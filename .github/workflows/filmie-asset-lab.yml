name: Filmie asset generation smoke

on:
  workflow_dispatch:
  push:
    branches: [filmieTwo]
    paths:
      - .github/workflows/filmie-asset-lab.yml
      - apps/cli/src/index.ts
      - engines/blender/src/procedural-assets.ts
      - engines/blender/src/asset-publisher.ts
      - engines/blender/worker/procedural_asset.py
      - engines/blender/worker/asset_preview.py
      - engines/blender/worker/model_import.py
      - examples/asset-lab/**
      - apps/web/src/**
      - apps/web-api/src/**
      - scripts/smoke_asset_studio.py

permissions:
  contents: read

concurrency:
  group: asset-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install headless Blender
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil libegl1 libgl1-mesa-dri xvfb xauth
          blender --version | head -n 2
      - name: Build asset pipeline
        run: pnpm exec tsc -b packages/contracts packages/assets packages/scene engines/blender apps/cli apps/web-api apps/web --pretty false
      - name: Bundle browser workspaces
        run: pnpm --filter @filmmaking/web build
      - name: Generate, validate, publish and reimport preview
        run: |
          mkdir -p renders/asset-lab
          printf '%s\n' '#!/bin/sh' 'exec xvfb-run -a blender "$@"' > /tmp/filmie-blender
          chmod +x /tmp/filmie-blender
          node apps/cli/dist/index.js build-procedural-asset \
            --definition examples/asset-lab/crane.definition.json \
            --registry renders/asset-lab/assets.json \
            --license-name "Filmie reference demo" \
            --preview renders/asset-lab/crane.png \
            --blender /tmp/filmie-blender \
            --timeout 180000 > renders/asset-lab/build.json || {
              cat renders/asset-lab/build.json
              exit 1
            }
          python3 - <<'PY'
          import glob, json, struct
          from pathlib import Path
          result = json.loads(Path("renders/asset-lab/build.json").read_text())
          assert result["build"]["status"] == "published", result
          assert result["preview"]["status"] == "rendered", result
          png = Path("renders/asset-lab/crane.png").read_bytes()
          assert png[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10])
          assets = json.loads(Path("renders/asset-lab/assets.json").read_text())
          assert len(assets) == 1 and assets[0]["assetId"] == "filmie.demo.crane"
          assert len(assets[0]["descriptor"]["resolvedHandles"]) >= 6
          glbs = glob.glob("renders/asset-lab/artifacts/*.glb")
          assert len(glbs) == 1
          glb = Path(glbs[0]).read_bytes()
          json_size = struct.unpack_from("<I", glb, 12)[0]
          document = json.loads(glb[20:20 + json_size])
          assert len(document["nodes"]) == 7, [node.get("name") for node in document["nodes"]]
          assert len(document["scenes"]) == 1 and len(document["scenes"][0]["nodes"]) == 1
          print("Asset Lab: published GLB, semantic mappings and reimported PNG verified.")
          PY
      - name: Confirm immutable publishing is reusable
        run: |
          node apps/cli/dist/index.js build-procedural-asset \
            --definition examples/asset-lab/crane.definition.json \
            --registry renders/asset-lab/assets.json \
            --license-name "Filmie reference demo" \
            --preview renders/asset-lab/crane.png \
            --blender /tmp/filmie-blender \
            --timeout 180000 > renders/asset-lab/repeated.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("renders/asset-lab/repeated.json").read_text())
          assert result["build"]["status"] == "reused", result
          assert result["preview"]["status"] == "rendered", result
          PY
      - name: Verify browser API creates a real published asset and project attachment
        run: |
          mkdir -p renders/asset-lab
          printf '%s\n' '#!/bin/sh' 'exec xvfb-run -a blender "$@"' > /tmp/filmie-blender
          chmod +x /tmp/filmie-blender
          FILMIE_BLENDER=/tmp/filmie-blender FILMIE_WEB_PORT=4173 node apps/web-api/dist/index.js > renders/asset-lab/web-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          python3 scripts/smoke_asset_studio.py || {
            cat renders/asset-lab/web-server.log
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filmie-asset-lab
          path: |
            renders/asset-lab/
          retention-days: 7
